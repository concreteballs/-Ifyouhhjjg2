name: Spectral Core Guard and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spectral-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate protected repository baseline
        run: python tools/verify_guard.py
      - name: Compile Python sources
        run: python -m compileall -q spectral_core spectral_monitor research tests tools
      - name: Run complete test suite
        run: python -m unittest discover -s tests -v
